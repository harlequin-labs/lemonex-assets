<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#3ee6c8"/>
      <stop offset="1" stop-color="#1279b8"/>
    </radialGradient>
    <radialGradient id="peel" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff27a"/>
      <stop offset="0.6" stop-color="#ffd91a"/>
      <stop offset="1" stop-color="#f2b705"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2b6b"/>
      <stop offset="1" stop-color="#120c24"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- sparkles -->
  <g fill="#fff" opacity="0.9">
    <path d="M86 112 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z"/>
    <path d="M430 380 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
    <circle cx="420" cy="118" r="6"/>
    <circle cx="96" cy="400" r="5"/>
  </g>
  <g transform="rotate(-18 256 280)">
    <!-- shadow -->
    <ellipse cx="262" cy="292" rx="176" ry="138" fill="#0b3d66" opacity="0.25"/>
    <!-- lemon tips -->
    <path d="M90 248 q-72 32 0 64z" fill="#f7c512" stroke="#d99a00" stroke-width="6" stroke-linejoin="round"/>
    <path d="M422 248 q72 32 0 64z" fill="#f7c512" stroke="#d99a00" stroke-width="6" stroke-linejoin="round"/>
    <!-- body -->
    <ellipse cx="256" cy="280" rx="176" ry="138" fill="url(#peel)" stroke="#d99a00" stroke-width="6"/>
    <!-- peel dimples -->
    <g fill="#e6a800" opacity="0.45">
      <circle cx="160" cy="230" r="4"/><circle cx="350" cy="220" r="4"/><circle cx="380" cy="330" r="4"/>
      <circle cx="140" cy="330" r="4"/><circle cx="300" cy="380" r="4"/><circle cx="210" cy="372" r="3"/>
      <circle cx="330" cy="180" r="3"/><circle cx="190" cy="180" r="3"/>
    </g>
    <!-- shine -->
    <ellipse cx="190" cy="196" rx="58" ry="24" fill="#fff" opacity="0.55" transform="rotate(-20 190 196)"/>
    <!-- sunglasses -->
    <path d="M150 262 q0 -10 10 -10 h82 q10 0 10 10 v14 q0 36 -40 36 h-22 q-40 0 -40 -36z" fill="url(#lens)"/>
    <path d="M270 262 q0 -10 10 -10 h82 q10 0 10 10 v14 q0 36 -40 36 h-22 q-40 0 -40 -36z" fill="url(#lens)"/>
    <path d="M250 262 q11 -10 22 0" fill="none" stroke="#120c24" stroke-width="9" stroke-linecap="round"/>
    <path d="M150 258 l-46 -8 M372 258 l46 -8" stroke="#120c24" stroke-width="9" stroke-linecap="round"/>
    <path d="M168 266 l26 0 M288 266 l26 0" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <!-- cheeks -->
    <ellipse cx="160" cy="336" rx="22" ry="13" fill="#ff7a6b" opacity="0.55"/>
    <ellipse cx="362" cy="336" rx="22" ry="13" fill="#ff7a6b" opacity="0.55"/>
    <!-- grin -->
    <path d="M206 336 q50 50 100 0 q-50 18 -100 0z" fill="#7a2f1d" stroke="#5a1f12" stroke-width="5" stroke-linejoin="round"/>
    <path d="M232 348 q24 10 48 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <!-- stem and leaf -->
    <path d="M262 144 q4 -26 -6 -44" fill="none" stroke="#6b4a1a" stroke-width="10" stroke-linecap="round"/>
    <path d="M258 108 q60 -70 128 -40 q-50 66 -128 40z" fill="#3cc24a" stroke="#1f8a2c" stroke-width="6" stroke-linejoin="round"/>
    <path d="M266 104 q50 -22 104 -32" fill="none" stroke="#1f8a2c" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
